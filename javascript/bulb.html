<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulb ON/OFF</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
            /*background: #222;*/
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
        }

        
        .bulb {
            width: 120px;
            height: 120px;
            background: #555;
            border-radius: 50%;
            margin: auto;
            transition: 0.4s;
        }

        .on {
            background: yellow;
            box-shadow: 0 0 20px yellow,
                        0 0 40px yellow,
                        0 0 60px yellow,
                        0 0 80px yellow;
        }

    

        button {
            margin: 20px 10px;
            padding: 10px 20px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #onBtn {
            /* background: green; */
            /* color: white; */
        }

        #offBtn {
            /* background: red; */
            /* color: white; */
        }

        button:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

<div class="container">

    <div id="bulb" class="bulb"></div>
    <div class="holder"></div>

    <br>

    <button id="onBtn">Turn ON</button>
    <button id="offBtn">Turn OFF</button>

</div>

<script>
    const bulb = document.getElementById("bulb");

    document.getElementById("onBtn").addEventListener("click", function () {
        bulb.classList.add("on");
    });

    document.getElementById("offBtn").addEventListener("click", function () {
        bulb.classList.remove("on");
    });
</script>

</body>
</html>
